<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>District — Profil</title>
<link rel="stylesheet" href="../style.css">

<style>
.profile-card {
  max-width: 760px;
  margin: 40px auto;
  padding: 35px;
  text-align: center;
  background: rgba(10,14,18,.88);
  border: 1px solid rgba(155,211,91,.25);
  border-radius: 18px;
}

.profile-avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 3px solid #9bd35b;
  object-fit: cover;
  margin-bottom: 20px;
}

.profile-name {
  font-size: 30px;
  font-weight: 700;
}

.profile-id {
  opacity: .55;
  margin-top: 5px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
  margin-top: 30px;
}

.stat {
  padding: 20px;
  background: rgba(255,255,255,.04);
  border-radius: 12px;
}

.stat strong {
  display: block;
  font-size: 26px;
}

.profile-extra {
  margin-top: 20px;
  padding: 20px;
  background: rgba(255,255,255,.04);
  border-radius: 12px;
}

.login-box {
  max-width: 600px;
  margin: 60px auto;
  text-align: center;
}

@media (max-width:600px) {
  .stats {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<header class="topbar">
  <a class="brand" href="../index.html">
    DISTRICT
    <span>DAYZ SERVER</span>
  </a>

  <nav>
    <a href="../index.html">⌂</a>
    <a href="server.html">▤</a>
    <a href="shop.html">🛒</a>
    <a href="clans.html">◉</a>
  </nav>
</header>

<main>

<div id="profile"></div>

</main>

<script>
async function loadProfile() {

  const container = document.getElementById("profile");

  try {

  const response = await fetch("/api/profile", {
  credentials: "include"
});

const data = await response.json();

if (!data.loggedIn) {
  container.innerHTML = `
    <div class="login-box">
      <div class="eyebrow">DISTRICT / PROFILE</div>
      <h1>NEJSI PŘIHLÁŠENÝ</h1>
      <p>Pro zobrazení profilu se nejdříve přihlas přes Discord.</p>
      <br>
      <a href="/api/auth/discord">Přihlásit přes Discord</a>
    </div>
  `;
  return;
}

const player = data.player;
const discord = data.discord;

const kd = player.deaths > 0
  ? (player.kills / player.deaths).toFixed(2)
  : player.kills.toFixed(2);

container.innerHTML = `
  <section class="profile-card">

    <div class="eyebrow">DISTRICT / PROFILE</div>

    <img
      class="profile-avatar"
      src="${escapeHtml(discord.avatar)}"
      alt="Discord avatar"
    >

    <div class="profile-name">
      ${escapeHtml(discord.global_name || discord.username)}
    </div>

    <div class="profile-id">
      Discord ID: ${escapeHtml(discord.id)}
    </div>

    <div class="stats">

      <div class="stat">
        <strong>${player.kills}</strong>
        KILLS
      </div>

      <div class="stat">
        <strong>${player.deaths}</strong>
        DEATHS
      </div>

      <div class="stat">
        <strong>${kd}</strong>
        K/D
      </div>

    </div>

    <div class="profile-extra">

      <p><strong>PSN</strong></p>
      <p>${escapeHtml(player.psn_username || "Nenastaveno")}</p>

      <p><strong>CLAN</strong></p>
      <p>${escapeHtml(player.clan || "Bez klanu")}</p>

      <p><strong>VIP</strong></p>
      <p>${escapeHtml(player.vip || "None")}</p>

      <p><strong>DISTRICT COINS</strong></p>
      <p>${player.coins}</p>

    </div>

    <br>

    <a href="../index.html">← Zpět na District</a>

  </section>
`;

    container.innerHTML = `
      <section class="profile-card">

        <div class="eyebrow">DISTRICT / PROFILE</div>

        <img
          class="profile-avatar"
          src="${escapeHtml(user.avatar)}"
          alt="Discord avatar"
        >

        <div class="profile-name">
          ${escapeHtml(user.global_name || user.username)}
        </div>

        <div class="profile-id">
          Discord ID: ${escapeHtml(user.id)}
        </div>

        <div class="stats">

          <div class="stat">
            <strong>—</strong>
            KILLS
          </div>

          <div class="stat">
            <strong>—</strong>
            DEATHS
          </div>

          <div class="stat">
            <strong>—</strong>
            K/D
          </div>

        </div>

        <div class="profile-extra">
          <p><strong>CLAN</strong></p>
          <p>Bez klanu</p>

          <p><strong>VIP</strong></p>
          <p>Žádné</p>

          <p><strong>DISTRICT COINS</strong></p>
          <p>0</p>
        </div>

        <br>

        <a href="../index.html">
          ← Zpět na District
        </a>

      </section>
    `;

  } catch (error) {

    container.innerHTML = `
      <div class="login-box">
        <h1>CHYBA</h1>
        <p>Nepodařilo se načíst profil.</p>
      </div>
    `;

  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadProfile();
</script>

</body>
</html>
